name: Personal build

# Builds an ad-hoc signed omux.app from this fork's feature branch for personal use.
on:
  push:
    branches: [feature/claude-session-name-inheritance]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tests
        run: swift test
      - name: Build app bundle
        run: ./build.sh
      - name: Zip
        run: ditto -c -k --keepParent build/omux.app omux.zip
      - uses: actions/upload-artifact@v4
        with:
          name: omux-app
          path: omux.zip
          retention-days: 30
